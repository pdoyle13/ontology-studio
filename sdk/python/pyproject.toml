[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-studio"
version = "0.1.0"
description = "Python client for Ontology Studio - SPARQL, search, GraphQL, virtual layer, federation, crosswalks, tagging"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["ontology_studio*"]
