name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format check (prettier)
        run: npm run format:check
      - name: Lint (eslint)
        run: npm run lint:es
      - name: Type-check + build (tsc -b && vite build)
        run: npm run build
      - name: Unit tests (vitest)
        run: npx vitest run
