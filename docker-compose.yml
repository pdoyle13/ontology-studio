services:
  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:latest
    command: serve --location /data --bind 0.0.0.0:7878
    volumes:
      - oxigraph-data:/data
    # add a ports: mapping here if you want direct store access from the host
    # (7878 on this machine is taken by the kalshi stack's Oxigraph)

  studio:
    build: .
    image: ${STUDIO_IMAGE:-ontology-studio:local}
    depends_on:
      - oxigraph
    environment:
      OXIGRAPH_URL: http://oxigraph:7878
      KAFKA_BROKERS: kafka:9092
      GROK_API_KEY: ${GROK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-grok-4}
      SEARCH_URL: ${SEARCH_URL:-}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-60000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7881/es"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - studio-sources:/app/server-state
      # mount host folders read-only to attach their SQLite files, e.g.:
      # - ./data:/data:ro
    ports:
      - "8890:7881"

volumes:
  kafka-data:
  oxigraph-data:
  studio-sources:
